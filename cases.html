<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>客户案例 · 博彦设计</title>
<meta name="keywords" content="博彦设计案例,阿里案例,美团案例,京东案例,包装设计案例,IP设计案例">
<meta name="description" content="博彦设计客户案例：长期服务阿里、蚂蚁、美团、京东、百度、快手等头部企业，覆盖电商、金融、文娱、食品、新能源等行业。">
<link rel="stylesheet" href="assets/css/style.css">
<style>
.hot-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hot-tag {
  display: inline-block; padding: 4px 14px; border: 1px solid var(--c-line);
  border-radius: 999px; font-size: 13px; color: var(--c-muted);
  transition: all .2s; cursor: pointer;
}
.hot-tag:hover { border-color: var(--c-primary); color: var(--c-primary); background: rgba(26,79,214,.04); }
</style>
</head>
<body data-page="cases">

<div class="crumb">
  <div class="wrap"><a href="index.html">首页</a><span>&rsaquo;</span>客户案例</div>
</div>

<section style="padding:44px 0 0">
  <div class="wrap">
    <h1 style="font-size:36px;color:var(--c-ink);font-weight:700;letter-spacing:-.5px">客户案例</h1>
    <p style="color:var(--c-muted);margin-top:8px">支持关键词搜索与「行业 / 服务」组合筛选，结果可分享</p>
  </div>
</section>

<!-- ============ 搜索 + 筛选 ============ -->
<section class="filter-bar">
  <div class="wrap">
    <div class="search-box">
      <input type="text" id="kw" placeholder="输入客户或案例关键词搜索">
      <button class="btn btn-primary" id="btnSearch">搜索</button>
    </div>

    <div class="hot-tags" style="margin-bottom:22px">
      <span style="font-size:13px;color:var(--c-muted);margin-right:10px">热门搜索：</span>
      <a href="javascript:;" class="hot-tag" data-kw="电商新零售">电商新零售</a>
      <a href="javascript:;" class="hot-tag" data-kw="金融科技">金融科技</a>
      <a href="javascript:;" class="hot-tag" data-kw="文娱">文娱</a>
      <a href="javascript:;" class="hot-tag" data-kw="生活服务">生活服务</a>
      <a href="javascript:;" class="hot-tag" data-kw="食品酒饮">食品酒饮</a>
      <a href="javascript:;" class="hot-tag" data-kw="3C家电">3C 家电</a>
      <a href="javascript:;" class="hot-tag" data-kw="新能源">新能源</a>
      <a href="javascript:;" class="hot-tag" data-kw="半导体">半导体</a>
    </div>

    <div class="filter-row">
      <div class="filter-label">行业</div>
      <div class="filter-opts" data-dim="i">
        <button class="fopt active" data-v="">不限</button>
        <button class="fopt" data-v="电商新零售">电商新零售</button>
        <button class="fopt" data-v="金融科技">金融科技</button>
        <button class="fopt" data-v="文娱">文娱</button>
        <button class="fopt" data-v="生活服务">生活服务</button>
        <button class="fopt" data-v="食品酒饮">食品酒饮</button>
        <button class="fopt" data-v="3C家电">3C 家电</button>
        <button class="fopt" data-v="新能源">新能源</button>
        <button class="fopt" data-v="半导体">半导体</button>
        <button class="fopt" data-v="服饰">服饰</button>
        <button class="fopt" data-v="大健康">大健康</button>
        <button class="fopt" data-v="箱包">箱包</button>
        <button class="fopt" data-v="美妆">美妆</button>
      </div>
    </div>

    <div class="filter-row">
      <div class="filter-label">服务</div>
      <div class="filter-opts" data-dim="s">
        <button class="fopt active" data-v="">不限</button>
        <button class="fopt" data-v="平面视觉">平面视觉</button>
        <button class="fopt" data-v="图拍视频">图拍视频</button>
        <button class="fopt" data-v="包装设计">包装设计</button>
        <button class="fopt" data-v="品牌设计">品牌设计</button>
        <button class="fopt" data-v="整合营销">整合营销</button>
        <button class="fopt" data-v="3D设计">3D 设计</button>
        <button class="fopt" data-v="UI设计">UI 设计</button>
        <button class="fopt" data-v="IP设计">IP设计</button>
        <button class="fopt" data-v="AIGC">AIGC</button>
      </div>
    </div>

  </div>
</section>

<!-- ============ 结果区 ============ -->
<section class="sec" style="padding-top:0">
  <div class="wrap">
    <div class="filter-state" id="fstate"></div>
    <div class="case-grid" id="caseList"></div>
    <div class="pager" id="pager">
      <a href="javascript:;">上一页</a>
      <span class="cur">1</span>
      <a href="javascript:;">2</a>
      <a href="javascript:;">3</a>
      <a href="javascript:;">下一页</a>
    </div>
  </div>
</section>

<!-- ============ 客户墙 ============ -->
<section class="sec soft">
  <div class="wrap">
    <div class="sec-head center rv">
      <div class="sec-kicker">Trusted By</div>
      <h2 class="sec-title">合作客户</h2>
    </div>
    <div class="client-marquee" id="clientMarquee"><!-- JS 渲染：自动滚动轮播 --></div>
  </div>
</section>

<script src="assets/js/main.js"></script>
<script>
/* 案例数据复用 main.js 中的 SITE_CASES（模拟接口返回） */
var CASES = (typeof SITE_CASES !== 'undefined') ? SITE_CASES : [];

/* 行业名称映射：旧数据 → Excel v3 新行业 */
var INDUSTRY_MAP = {
  '电商零售': '电商新零售',
  '金融': '金融科技',
  '科技': '金融科技',
  '技术服务': '金融科技',
  '食品': '食品酒饮',
  '3C家电': '3C 家电',
  '大健康': '大健康',
  '生活服务': '生活服务',
  '文娱': '文娱',
  '新能源': '新能源',
  '半导体': '半导体',
  '服饰': '服饰',
  '箱包': '箱包'
};
function mapIndustry(v) { return INDUSTRY_MAP[v] || v; }
function mapService(v) { if(v==='包装设计') return '品牌包装'; if(v==='AIGC') return 'AIGC赋能'; if(v==='IP设计') return 'IP 文创'; return v; }

var F = { i:'', s:'', kw:'' };
var DIM_NAME = { i:'行业', s:'服务', kw:'关键词' };
var P = 1;            /* 当前页码 */
var PAGE_SIZE = 24;   /* 每页 24 个案例 = 8 排 × 3 列 */

function syncURL() {
  var p = [];
  Object.keys(F).forEach(function(k){ if (F[k]) p.push(k + '=' + encodeURIComponent(F[k])); });
  if (P > 1) p.push('p=' + P);
  history.replaceState(null, '', location.pathname + (p.length ? '?' + p.join('&') : ''));
}

function render() {
  var list = CASES.filter(function (x) {
    var xi = mapIndustry(x.i);
    var xs = mapService(x.s);
    return (!F.i   || xi === F.i)
        && (!F.s   || xs === F.s)
        && (!F.kw  || (x.n + x.c + x.d).indexOf(F.kw) > -1);
  });

  var chips = Object.keys(F).filter(function(k){ return F[k]; }).map(function (k) {
    return '<span class="chip"><b>' + DIM_NAME[k] + '：</b>' + F[k] +
           '<i class="x" data-k="' + k + '">&times;</i></span>';
  }).join('');
  document.getElementById('fstate').innerHTML =
    '共 <b style="color:var(--c-ink)">' + list.length + '</b> 个案例' +
    (chips ? '&nbsp;&nbsp;' + chips + '<span class="clear-all" id="clearAll">清空全部</span>' : '');

  var box = document.getElementById('caseList');
  var pagerBox = document.getElementById('pager');
  var totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if (P > totalPages) P = totalPages;
  if (!list.length) {
    box.innerHTML = '<div class="empty-state" style="grid-column:1/-1">' +
      '<div class="ph circle" data-label="空状态插图"></div>' +
      '<p>没有找到匹配的案例，试试放宽筛选条件</p>' +
      '<p style="font-size:13px;margin-top:6px">此处可展示推荐案例，避免用户流失</p></div>';
    pagerBox.style.display = 'none';
  } else {
    var pageList = list.slice((P - 1) * PAGE_SIZE, P * PAGE_SIZE);
    box.innerHTML = pageList.map(function (x) {
      return '<a class="case-card" href="case-detail.html?c=' + encodeURIComponent(x.id) + '">' +
        '<div class="case-cover"><div class="img-fit r-4-3" style="background-image:url(\'assets/img/' + x.img + '\')"></div>' +
          '<div class="case-hover"><span class="view">查看案例</span></div></div>' +
        '<div class="case-meta"><div class="case-client">' + x.c + '</div>' +
          '<div class="case-name">' + x.n + '</div>' +
          '<div class="case-tags"><span>' + mapIndustry(x.i) + '</span><span>' + mapService(x.s) + '</span></div>' +
        '</div></a>';
    }).join('');
    /* 动态分页器 */
    if (totalPages <= 1) {
      pagerBox.style.display = 'none';
    } else {
      pagerBox.style.display = 'flex';
      var ph = '';
      ph += '<a href="javascript:;" data-p="' + (P - 1) + '">上一页</a>';
      for (var i = 1; i <= totalPages; i++) {
        ph += i === P ? '<span class="cur">' + i + '</span>' : '<a href="javascript:;" data-p="' + i + '">' + i + '</a>';
      }
      ph += '<a href="javascript:;" data-p="' + (P + 1) + '">下一页</a>';
      pagerBox.innerHTML = ph;
      pagerBox.querySelectorAll('a[data-p]').forEach(function (a) {
        a.onclick = function () {
          var p = parseInt(this.getAttribute('data-p'), 10);
          if (p < 1 || p > totalPages) return;
          P = p;
          syncURL(); render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
      });
    }
  }

  document.querySelectorAll('#fstate .x').forEach(function (el) {
    el.onclick = function () {
      var k = el.getAttribute('data-k');
      F[k] = '';
      P = 1;
      if (k === 'kw') document.getElementById('kw').value = '';
      else setActive(k, '');
      syncURL(); render();
    };
  });
  var ca = document.getElementById('clearAll');
  if (ca) ca.onclick = function () {
    Object.keys(F).forEach(function(k){ F[k] = ''; });
    P = 1;
    document.getElementById('kw').value = '';
    ['i','s'].forEach(function(k){ setActive(k, ''); });
    syncURL(); render();
  };
}

function setActive(dim, v) {
  var box = document.querySelector('[data-dim="' + dim + '"]');
  if (!box) return;
  box.querySelectorAll('.fopt').forEach(function (b) {
    b.classList.toggle('active', b.getAttribute('data-v') === v);
  });
}

window.pageInit = function () {
  ['i','s','kw'].forEach(function (k) {
    var m = new RegExp('[?&]' + k + '=([^&]*)').exec(location.search);
    if (m) F[k] = decodeURIComponent(m[1]);
  });
  var mp = new RegExp('[?&]p=(\\d+)').exec(location.search);
  if (mp) P = parseInt(mp[1], 10) || 1;
  ['i','s'].forEach(function(k){ setActive(k, F[k]); });
  document.getElementById('kw').value = F.kw;

  // 热门搜索标签点击
  document.querySelectorAll('.hot-tag').forEach(function(tag) {
    tag.onclick = function(e) {
      e.preventDefault();
      var kw = this.getAttribute('data-kw');
      document.getElementById('kw').value = kw;
      F.kw = kw;
      P = 1;
      syncURL(); render();
    };
  });

  document.querySelectorAll('.filter-opts').forEach(function (box) {
    var dim = box.getAttribute('data-dim');
    box.querySelectorAll('.fopt').forEach(function (b) {
      b.onclick = function () {
        F[dim] = b.getAttribute('data-v');
        P = 1;
        setActive(dim, F[dim]);
        syncURL(); render();
      };
    });
  });

  function doSearch() { F.kw = document.getElementById('kw').value.trim(); P = 1; syncURL(); render(); }
  document.getElementById('btnSearch').onclick = doSearch;
  document.getElementById('kw').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doSearch();
  });

  render();
  var m = document.getElementById('clientMarquee');
  if (m && typeof SITE_CLIENTS !== 'undefined') {
    var cells = SITE_CLIENTS.map(function (c) {
      return '<div class="client-cell"><span style="font-weight:700;color:var(--c-ink);font-size:16px;letter-spacing:1px;white-space:nowrap">' + c + '</span></div>';
    }).join('');
    m.innerHTML = '<div class="client-marquee-track">' + cells + cells + '</div>';
  }

};
</script>
</body>
</html>

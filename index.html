<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>博彦设计 · 一站式视觉整合方案服务商</title>
<meta name="keywords" content="博彦设计,博彦科技,包装设计,平面视觉,图拍视频,一站式视觉">
<meta name="description" content="博彦设计隶属博彦科技（上市公司），500+ 设计师团队，主营包装设计、平面视觉、图拍视频，长期服务阿里、蚂蚁、美团、京东等头部企业。">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="home" data-nav="dark">

<!-- ============ 首屏轮播 ============ -->
<section class="hero">
  <div class="hero-slide active">
    <div class="hero-bg" style="background-image:url('assets/img/hero.jpg')"></div>
    <div class="hero-mask"></div>
    <div class="hero-body">
      <span class="hero-tag">博彦设计 · BEYONDSOFT DESIGN</span>
      <h1 class="hero-title">你的设计，我来解决<br>一站式视觉整合方案服务商</h1>
      <p class="hero-desc">博彦设计隶属博彦科技（上市公司），深耕设计行业 18 年。从平面设计创作到品牌影像宣传片，为企业提供全品类视觉内容一体化解决方案。</p>
      <div class="hero-btns">
        <a href="about.html" class="btn btn-primary">查看公司简介</a>
        <button class="btn btn-ghost js-consult" data-from="首页Banner-1">免费咨询</button>
      </div>
    </div>
  </div>

  </section>

<!-- ============ 数据概览 ============ -->
<section class="sec" style="padding:64px 0">
  <div class="wrap">
    <div class="stat-grid rv">
      <div><div class="stat-num">18<small>年</small></div><div class="stat-label">深耕设计行业</div></div>
      <div><div class="stat-num">20000<small>+</small></div><div class="stat-label">累计服务客户案例</div></div>
      <div><div class="stat-num">85<small>%</small></div><div class="stat-label">互联网名企覆盖</div></div>
      <div><div class="stat-num">10<small>城</small></div><div class="stat-label">覆盖全国主流城市</div></div>
    </div>
  </div>
</section>

<!-- ============ 精选案例 ============ -->
<section class="sec soft">
  <div class="wrap">
    <div class="sec-head center rv">
      <div class="sec-kicker">Featured Works</div>
      <h2 class="sec-title">客户案例</h2>
    </div>

    <div class="tabs rv" id="homeTabs">
      <button class="tab active" data-cat="全部">全部</button>
      <button class="tab" data-cat="电商零售">电商零售</button>
      <button class="tab" data-cat="金融科技">金融科技</button>
      <button class="tab" data-cat="生活服务">生活服务</button>
      <button class="tab" data-cat="食品">食品</button>
      <button class="tab" data-cat="新能源">新能源</button>
      <button class="tab" data-cat="半导体">半导体</button>
    </div>

    <div class="case-grid" id="homeCases"><!-- JS 渲染 --></div>

    <div class="more-wrap rv">
      <a href="cases.html" class="btn btn-line">查看更多案例</a>
    </div>
  </div>
</section>

<!-- ============ 九大服务板块（只留名称+英文，排版突出三主营） ============ -->
<section class="sec">
  <div class="wrap">
    <div class="sec-head center rv">
      <div class="sec-kicker">What We Do</div>
      <h2 class="sec-title">一站式视觉整合服务商</h2>
    </div>

    <div class="svc-grid" id="homeSvcGrid"><!-- JS 渲染九大模块 --></div>
  </div>
</section>

<!-- ============ 客户墙 ============ -->
<section class="sec soft">
  <div class="wrap">
    <div class="sec-head center rv">
      <div class="sec-kicker">Trusted By</div>
      <h2 class="sec-title">合作客户</h2>
    </div>
    <div class="client-marquee" id="clientMarquee"><!-- JS 渲染：自动滚动轮播 --></div>
  </div>
</section>

<script src="assets/js/main.js"></script>
<script>
/* 首页案例数据（模拟接口返回） */
var HOME_CASES = [
  { id: 'c21', client: '阿里', name: '阿里巴巴 · 北京新园区开园KV', cat: '电商零售', tags: ['平面视觉'], img: 'case-alibaba.jpg' },
  { id: 'c07', client: '蚂蚁集团', name: '蚂蚁集团 · H5互动游戏与动效设计', cat: '金融科技', tags: ['H5互动'], img: 'case-antfin.jpg' },
  { id: 'c31', client: '美团', name: '美团 · 多业务线主视觉设计', cat: '生活服务', tags: ['平面视觉'], img: 'case-meituan.jpg' },
  { id: 'c75', client: '京东', name: '京东AVA大会 · 开场概念视频', cat: '电商零售', tags: ['图拍视频'], img: 'case-jd-618.jpg' },
  { id: 'c17', client: '百度', name: '百度 · 1024程序员节KV设计', cat: '金融科技', tags: ['平面视觉'], img: 'case-baidu.jpg' },
  { id: 'c48', client: '古茗', name: '古茗 · 新品上新系列海报', cat: '食品', tags: ['平面视觉'], img: 'case-guming.jpg' },
  { id: 'c05', client: '宁德时代', name: '宁德时代 · 星河IP及icon设计', cat: '新能源', tags: ['包装设计'], img: 'case-catl.jpg' },
  { id: 'c02', client: '玄铁', name: '玄铁 · 品牌VI与UI设计体系', cat: '半导体', tags: ['平面视觉'], img: 'case-xuantie.jpg' }
];


/* 九大服务模块：只留名称+英文，三个主营排版突出 */
var HOME_SERVICES = [
  { n:'平面视觉', en:'Graphic & Brand Visual', main:true },
  { n:'图拍视频', en:'Film & Video', main:true },
  { n:'包装设计', en:'Packaging Design', main:true },
  { n:'整合营销', en:'Integrated Marketing', main:false },
  { n:'品牌设计', en:'Brand Design', main:false },
  { n:'IP 文创', en:'Cultural Creative', main:false },
  { n:'三维设计', en:'3D Design', main:false },
  { n:'UI 设计', en:'User Interface', main:false },
  { n:'AIGC', en:'AI Generated Art', main:false }
];

function renderHomeSvc() {
  var box = document.getElementById('homeSvcGrid');
  if (!box) return;
  box.innerHTML = HOME_SERVICES.map(function (s, i) {
    return '<div class="svc-card svc-mini' + (s.main ? ' svc-featured' : '') + '" data-idx="' + i + '">' +
      '<span class="svc-idx">' + (i < 9 ? '0' + (i + 1) : i + 1) + '</span>' +
      '<h3 class="svc-name">' + s.n + '</h3>' +
      '<div class="svc-en">' + s.en + '</div>' +
    '</div>';
  }).join('');
}

function renderClientWall() {
  renderLogoMarquee('clientMarquee');
}

function renderHomeCases(cat) {
  var list = cat === '全部' ? HOME_CASES : HOME_CASES.filter(function (c) { return c.cat === cat; });
  var box = document.getElementById('homeCases');
  if (!list.length) {
    box.innerHTML = '<div class="empty-state" style="grid-column:1/-1">' +
      '<div class="ph circle" data-label="空状态"></div>' +
      '<p>该分类暂无案例，可在此位置推荐其他案例</p></div>';
    return;
  }
  box.innerHTML = list.map(function (c) {
    var link = 'case-detail.html?c=' + encodeURIComponent(c.id || c.client);
    return '<a class="case-card" href="' + link + '">' +
      '<div class="case-cover"><div class="img-fit r-4-3" style="background-image:url(\'assets/img/' + c.img + '\')"></div>' +
        '<div class="case-hover"><span class="view">查看案例</span></div></div>' +
      '<div class="case-meta">' +
        '<div class="case-client">' + c.client + '</div>' +
        '<div class="case-name">' + c.name + '</div>' +
        '<div class="case-tags">' + c.tags.map(function (t) { return '<span>' + t + '</span>'; }).join('') + '</div>' +
      '</div></a>';
  }).join('');
}

window.pageInit = function () {
  renderHomeCases('全部');
  renderHomeSvc();
  renderClientWall();
  document.querySelectorAll('#homeTabs .tab').forEach(function (t) {
    t.onclick = function () {
      document.querySelectorAll('#homeTabs .tab').forEach(function (x) { x.classList.remove('active'); });
      t.classList.add('active');
      renderHomeCases(t.getAttribute('data-cat'));
    };
  });
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频案例 · 博彦设计</title>
<meta name="keywords" content="博彦设计视频,宣传片,TVC,动画视频,京东视频,阿里云视频,宁德时代视频">
<meta name="description" content="博彦设计视频案例：宣传片、TVC、MG 动画、AIGC 视频，服务京东、阿里云、宁德时代、科沃斯、海尔等头部企业。">
<link rel="stylesheet" href="assets/css/style.css">
<style>
/* ===== 视频案例页样式（11 Build 奢侈极简） ===== */
.video-hero {
  position: relative; height: 420px; display: flex; align-items: center;
  background: #0a0c10; overflow: hidden;
}
.video-hero-mask {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(6,8,12,.78) 0%, rgba(6,8,12,.42) 100%);
}
.video-hero-body { position: relative; z-index: 2; color: #fff; width: 100%; max-width: var(--maxw); margin: 0 auto; padding: 0 40px; }
.video-hero .hero-tag {
  display: inline-block; padding: 5px 14px; border: 1px solid rgba(255,255,255,.4);
  border-radius: 999px; font-size: 12px; letter-spacing: 1px; margin-bottom: 22px;
}
.video-hero h1 { font-size: 44px; font-weight: 200; letter-spacing: 1px; margin-bottom: 16px; line-height: 1.3; }
.video-hero p { color: rgba(255,255,255,.64); font-size: 15px; max-width: 520px; }

.video-section { padding: 92px 0; }
.video-section.soft { background: var(--c-bg-soft); }
.video-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
.video-card {
  background: #fff; border: 1px solid var(--c-line); border-radius: var(--radius);
  overflow: hidden; cursor: pointer; transition: all .3s var(--ease); display: block;
}
.video-card:hover { box-shadow: var(--shadow-md); transform: translateY(-5px); border-color: rgba(26,79,214,.4); }
.video-cover {
  position: relative; aspect-ratio: 16/10; background: #16181d;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.video-cover .play-circle {
  width: 62px; height: 62px; border-radius: 50%; border: 1px solid rgba(255,255,255,.7);
  display: flex; align-items: center; justify-content: center;
  background: rgba(10,12,16,.35); transition: all .3s; z-index: 2;
}
.video-cover .play-circle::after {
  content: ""; width: 0; height: 0; margin-left: 5px;
  border-style: solid; border-width: 10px 0 10px 17px;
  border-color: transparent transparent transparent #fff;
}
.video-card:hover .play-circle { background: var(--c-primary); border-color: var(--c-primary); transform: scale(1.08); }
.video-cover .vc-tag {
  position: absolute; top: 14px; left: 14px; z-index: 2;
  padding: 4px 12px; border-radius: 999px; font-size: 12px;
  background: rgba(10,12,16,.55); color: #fff; letter-spacing: .5px; backdrop-filter: blur(6px);
}
.video-cover .vc-dur {
  position: absolute; right: 14px; bottom: 14px; z-index: 2;
  font-size: 12px; color: rgba(255,255,255,.85); background: rgba(10,12,16,.55);
  padding: 2px 10px; border-radius: 6px; backdrop-filter: blur(6px);
}
.video-meta { padding: 18px 20px 20px; }
.video-client { font-size: 12px; color: var(--c-primary); letter-spacing: 1px; margin-bottom: 6px; }
.video-name { font-size: 15px; color: var(--c-ink); font-weight: 500; line-height: 1.5; }

/* 播放器模态 */
.video-modal { position: fixed; inset: 0; z-index: 1100; display: none; }
.video-modal.open { display: block; }
.video-modal-mask { position: absolute; inset: 0; background: rgba(8,10,14,.88); backdrop-filter: blur(4px); }
.video-modal-box {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: min(960px, calc(100vw - 48px));
  background: #0d0f13; border-radius: 14px; overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,.5);
}
.video-modal-close {
  position: absolute; top: 12px; right: 16px; z-index: 5;
  color: rgba(255,255,255,.8); font-size: 28px; line-height: 1; padding: 6px; transition: color .2s;
}
.video-modal-close:hover { color: #fff; }
.video-modal-box video { width: 100%; display: block; aspect-ratio: 16/9; background: #000; }
.video-modal-info { padding: 18px 24px 22px; color: #fff; }
.video-modal-info .vm-client { font-size: 13px; color: rgba(255,255,255,.55); letter-spacing: 1px; margin-bottom: 6px; }
.video-modal-info .vm-name { font-size: 18px; font-weight: 500; }

/* GIF 墙 */
.gif-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.gif-card { background: #fff; border: 1px solid var(--c-line); border-radius: var(--radius); overflow: hidden; }
.gif-card img { width: 100%; display: block; aspect-ratio: 1/1; object-fit: cover; }
.gif-card .gif-meta { padding: 14px 18px 16px; }
.gif-card .gif-meta b { font-size: 14px; color: var(--c-ink); font-weight: 500; display: block; margin-bottom: 4px; }
.gif-card .gif-meta span { font-size: 12px; color: var(--c-muted); }

@media (max-width: 1024px) {
  .video-grid, .gif-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 720px) {
  .video-grid, .gif-grid { grid-template-columns: 1fr; }
  .video-hero h1 { font-size: 30px; }
  .video-hero-body { padding: 0 24px; }
}
</style>
</head>
<body data-page="video" data-nav="dark">

<section class="video-hero">
  <div class="hero-bg" style="background-image:url('assets/img/case-baidu.jpg');opacity:.4"></div>
  <div class="video-hero-mask"></div>
  <div class="video-hero-body">
    <span class="hero-tag">FILM &amp; VIDEO CASES</span>
    <h1>视频案例 · 让创意动起来</h1>
    <p>宣传片、TVC、MG 动画、AIGC 视频——点击卡片即可播放，真实项目原片直出。</p>
  </div>
</section>

<!-- ============ 视频案例 ============ -->
<section class="video-section">
  <div class="wrap">
    <div class="sec-head rv">
      <div class="sec-kicker">Video Works</div>
      <h2 class="sec-title">视频案例精选</h2>
      <p class="sec-sub">来自京东、阿里云、宁德时代、科沃斯、海尔等客户的真实交付</p>
    </div>
    <div class="video-grid rv" id="videoGrid"><!-- JS 渲染 --></div>
  </div>
</section>

<!-- ============ GIF 动效 ============ -->
<section class="video-section soft">
  <div class="wrap">
    <div class="sec-head rv">
      <div class="sec-kicker">Motion &amp; GIF</div>
      <h2 class="sec-title">动效 &amp; GIF 作品</h2>
      <p class="sec-sub">H5 互动动效、三维动画中的动态表达</p>
    </div>
    <div class="gif-grid rv" id="gifGrid"><!-- JS 渲染 --></div>
  </div>
</section>

<!-- ============ CTA ============ -->
<section class="sec" style="padding-bottom:100px">
  <div class="wrap" style="max-width:640px;text-align:center">
    <div class="rv">
      <div class="sec-kicker" style="margin-bottom:20px">Let's Talk</div>
      <h3 style="font-size:30px;color:var(--c-ink);font-weight:200;letter-spacing:1px;margin-bottom:18px">需要一支打动人的视频？</h3>
      <p style="color:var(--c-muted);font-size:14px;margin-bottom:32px">从创意脚本到成片交付，或 AIGC 高效出片，告诉我们你的需求</p>
      <button class="btn btn-primary js-consult" data-from="视频案例页CTA">免费咨询</button>
    </div>
  </div>
</section>

<!-- 播放器模态 -->
<div class="video-modal" id="videoModal">
  <div class="video-modal-mask js-vm-close"></div>
  <div class="video-modal-box">
    <button class="video-modal-close js-vm-close">&times;</button>
    <video id="vmVideo" controls playsinline preload="metadata"></video>
    <div class="video-modal-info">
      <div class="vm-client" id="vmClient"></div>
      <div class="vm-name" id="vmName"></div>
    </div>
  </div>
</div>

<script src="assets/js/main.js"></script>
<script>
/* 视频案例数据（来自 PPTX 提取的嵌入视频） */
var VIDEO_CASES = [
  { c:'京东', n:'京东 AVA 大会 · 开场概念篇', i:'科技', f:'set2_media5.mp4', dur:'—' },
  { c:'宁德时代', n:'宁德时代 · 星河系统宣传片', i:'新能源', f:'set2_media6.mp4', dur:'—' },
  { c:'阿里妈妈', n:'阿里妈妈 × 国家图书馆 · AIGC 宣传视频', i:'文化娱乐', f:'set2_media7.mp4', dur:'—' },
  { c:'Alipay HK', n:'Alipay HK · 香港支付宝宣传视频', i:'金融', f:'set2_media8.mp4', dur:'—' },
  { c:'阿里云', n:'阿里云 · 通义 AI 品牌传播视频', i:'科技', f:'set2_media9.mp4', dur:'—' },
  { c:'阿里云', n:'ESG 市场宣传动画', i:'科技', f:'set2_media10.mp4', dur:'—' },
  { c:'阿里', n:'堆友 D20 · 3D 宣传动画', i:'技术服务', f:'set2_media11.mp4', dur:'—' },
  { c:'京东', n:'京东 × MCM · 联名品牌活动视频', i:'箱包', f:'set2_media12.mp4', dur:'—' },
  { c:'科沃斯', n:'科沃斯 · 产品宣传视频', i:'3C 家电', f:'set2_media13.mp4', dur:'—' },
  { c:'海尔', n:'海尔 · 品牌形象宣传视频', i:'3C 家电', f:'set2_media14.mp4', dur:'—' },
  { c:'伊利', n:'世界杯 × 营养早餐 · 品牌宣传', i:'大健康', f:'set2_media15.mp4', dur:'—' },
  { c:'欢聚集团', n:'直播礼物动效 · 系列', i:'文化娱乐', f:'set2_media1.mp4', dur:'—' },
  { c:'阿里妈妈', n:'阿里妈妈 · AIGC 视频案例', i:'文化娱乐', f:'set1_media6.mp4', dur:'—' },
  { c:'蚂蚁集团', n:'蚂蚁 · AIGC 动效系列', i:'金融科技', f:'set1_media7.mp4', dur:'—' },
  { c:'饿了么', n:'饿了么 · H5 三维动画', i:'生活服务', f:'set1_media1.mp4', dur:'—' }
];

var GIF_CASES = [
  { n:'IP 动态展示 · 系列一', s:'IP 形象动效', f:'gif_image100.GIF' },
  { n:'IP 动态展示 · 系列二', s:'IP 形象动效', f:'gif_image101.GIF' },
  { n:'IP 动态展示 · 系列三', s:'IP 形象动效', f:'gif_image102.GIF' },
  { n:'IP 动态展示 · 系列四', s:'IP 形象动效', f:'gif_image103.GIF' },
  { n:'IP 动态展示 · 系列五', s:'IP 形象动效', f:'gif_image104.GIF' },
  { n:'IP 动态展示 · 系列六', s:'IP 形象动效', f:'gif_image105.GIF' },
  { n:'3D 场景动效 · 一', s:'三维动效', f:'gif_image278.GIF' },
  { n:'3D 场景动效 · 二', s:'三维动效', f:'gif_image279.GIF' },
  { n:'3D 场景动效 · 三', s:'三维动效', f:'gif_image280.GIF' }
];

function renderVideos() {
  var box = document.getElementById('videoGrid');
  if (!box) return;
  box.innerHTML = VIDEO_CASES.map(function (v, i) {
    return '<div class="video-card" data-i="' + i + '">' +
      '<div class="video-cover">' +
        '<span class="vc-tag">' + v.i + '</span>' +
        '<div class="play-circle"></div>' +
        '<span class="vc-dur">点击播放</span>' +
      '</div>' +
      '<div class="video-meta">' +
        '<div class="video-client">' + v.c + '</div>' +
        '<div class="video-name">' + v.n + '</div>' +
      '</div></div>';
  }).join('');

  box.querySelectorAll('.video-card').forEach(function (card) {
    card.onclick = function () {
      var v = VIDEO_CASES[parseInt(card.getAttribute('data-i'))];
      openPlayer(v);
    };
  });
}

function renderGifs() {
  var box = document.getElementById('gifGrid');
  if (!box) return;
  box.innerHTML = GIF_CASES.map(function (g) {
    return '<div class="gif-card">' +
      '<img src="assets/gifs/' + g.f + '" alt="' + g.n + '" loading="lazy">' +
      '<div class="gif-meta"><b>' + g.n + '</b><span>' + g.s + '</span></div></div>';
  }).join('');
}

function openPlayer(v) {
  var modal = document.getElementById('videoModal');
  var video = document.getElementById('vmVideo');
  video.src = 'assets/videos/' + v.f;
  document.getElementById('vmClient').textContent = v.c + ' · ' + v.i;
  document.getElementById('vmName').textContent = v.n;
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
  video.play().catch(function(){});
}

function closePlayer() {
  var modal = document.getElementById('videoModal');
  var video = document.getElementById('vmVideo');
  modal.classList.remove('open');
  document.body.style.overflow = '';
  video.pause();
  video.removeAttribute('src');
  video.load();
}

window.pageInit = function () {
  renderVideos();
  renderGifs();
  document.querySelectorAll('.js-vm-close').forEach(function (el) {
    el.onclick = closePlayer;
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closePlayer();
  });
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案例详情 · 博彦设计</title>
<meta name="keywords" content="博彦设计案例详情">
<meta name="description" content="博彦设计客户案例详情：项目背景、解决方案与视觉呈现。">
<link rel="stylesheet" href="assets/css/style.css?v=3">
</head>
<body data-page="cases">

<div class="crumb">
  <div class="wrap">
    <a href="index.html">首页</a><span>&rsaquo;</span>
    <a href="cases.html">客户案例</a><span>&rsaquo;</span>
    <a id="bcInd" href="cases.html">行业</a><span>&rsaquo;</span>案例详情
  </div>
</div>

<!-- ============ 项目主视觉 ============ -->
<section style="padding:44px 0 0">
  <div class="wrap">
    <div class="img-fit r-21-9" id="mainVisual" style="background-image:url('assets/img/case-alibaba.jpg')"></div>
  </div>
</section>

<div class="detail-head">
  <div class="wrap">
    <h1 id="cTitle">案例标题</h1>
    <div class="detail-info">
      <span id="cClient">客户：—</span>
      <span id="cIndustry">行业：—</span>
      <span id="cService">服务：—</span>
      <span id="cYear"></span>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="detail-body">

    <h2>项目背景</h2>
    <p id="cBg">—</p>

    <div class="img-fit r-16-9" id="v1" style="background-image:url('assets/img/case-aliyun.jpg');margin:26px 0"></div>

    <h2>视觉呈现</h2>
    <div class="img-fit r-3-2" id="v2" style="background-image:url('assets/img/case-meituan.jpg');margin:18px 0"></div>
    <div class="img-fit r-3-2" id="v3" style="background-image:url('assets/img/case-jd-618.jpg');margin:18px 0"></div>

    <h2>视频演示</h2>
    <p>TVC / 宣传片 / 动画类案例，点击播放真实项目视频。</p>
    <div id="videoZone"><!-- JS 渲染播放器 --></div>

    <h2>项目信息</h2>
    <table class="meta-table">
      <tr><th>客户名称</th><td id="tClient">—</td></tr>
      <tr><th>所属行业</th><td id="tIndustry">—</td></tr>
      <tr><th>服务内容</th><td id="tService">—</td></tr>
      <tr><th>交付形式</th><td id="tType">—</td></tr>
    </table>

    <div style="display:flex;gap:12px;flex-wrap:wrap;margin:30px 0">
      <button class="btn btn-line btn-sm" onclick="copyLink()">复制案例链接</button>
      <button class="btn btn-primary btn-sm js-consult" data-from="案例详情页">咨询类似项目</button>
    </div>

    <div class="detail-nav">
      <a href="cases.html" id="prevC">&lsaquo; 返回案例列表</a>
      <a href="cases.html">查看更多案例 &rsaquo;</a>
    </div>
  </div>
</div>

<!-- ============ 相关推荐 ============ -->
<section class="sec soft">
  <div class="wrap">
    <div class="sec-head"><h2 class="sec-title" style="font-size:26px">相关案例推荐</h2>
      <p class="sec-sub">同行业或同服务类型的更多案例</p></div>
    <div class="case-grid" id="relList"></div>
  </div>
</section>

<script src="assets/js/main.js?v=4"></script>
<script>
function copyLink() {
  var t = document.createElement('input');
  t.value = location.href;
  document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); alert('案例链接已复制'); } catch (e) { alert(location.href); }
  document.body.removeChild(t);
}

window.pageInit = function () {
  var id = param('c') || 'alibaba';
  var c = (typeof getCase === 'function') ? getCase(id) : null;
  if (!c && SITE_CASES && SITE_CASES.length) c = SITE_CASES[0];
  if (!c) return;

  document.title = c.n + ' · 博彦设计';
  document.getElementById('mainVisual').style.backgroundImage = "url('assets/img/" + c.img + "')";
  document.getElementById('cTitle').textContent = c.n;
  document.getElementById('cClient').textContent = '客户：' + c.c;
  document.getElementById('cIndustry').textContent = '行业：' + c.i;
  document.getElementById('cService').textContent = '服务：' + c.s;
  document.getElementById('cBg').textContent = c.d;
  document.getElementById('bcInd').textContent = c.i;
  document.getElementById('bcInd').href = 'cases.html?i=' + encodeURIComponent(c.i);

  document.getElementById('tClient').textContent = c.c;
  document.getElementById('tIndustry').textContent = c.i;
  document.getElementById('tService').textContent = c.s;
  document.getElementById('tType').textContent = c.t;

  // 案例视频：有映射则渲染真实播放器，无则隐藏视频区
  var vz = document.getElementById('videoZone');
  if (vz) vz.style.display = 'none'; /* 视频已移除，隐藏播放区 */
  var videos = (typeof CASE_VIDEOS !== 'undefined' && CASE_VIDEOS[c.id]) ? CASE_VIDEOS[c.id] : null;
  if (vz) {
    if (videos && videos.length) {
      var vhtml = '<div class="video-block" style="display:block;background:#000;overflow:hidden">' +
        '<video controls playsinline preload="metadata" style="width:100%;aspect-ratio:16/9;display:block;background:#000">' +
        videos.map(function (f) {
          return '<source src="assets/videos/' + f + '" type="video/mp4">';
        }).join('') +
        '</video></div>' +
        '<p style="text-align:center;font-size:12px;color:var(--c-muted);margin-top:10px">' +
        (videos.length > 1 ? '本案例含 ' + videos.length + ' 个视频，可切换播放' : '点击播放 · 支持全屏') + '</p>';
      vz.innerHTML = vhtml;
    } else {
      vz.innerHTML = '';
      var vsec = vz.closest('.detail-body');
      if (vsec) {
        // 隐藏视频标题与说明
        var hs = vsec.querySelectorAll('h2,p');
        var toHide = [];
        hs.forEach(function (el) {
          if (el.textContent.indexOf('视频演示') > -1) toHide.push(el);
        });
        toHide.forEach(function (el) { el.style.display = 'none'; });
        vz.style.display = 'none';
      }
    }
  }

  // 相关案例（同行业或同服务，排除自身）
  var rel = SITE_CASES.filter(function (x) {
    return x.id !== c.id && (x.i === c.i || x.s === c.s);
  });
  if (rel.length < 3) {
    SITE_CASES.forEach(function (x) {
      if (x.id !== c.id && rel.indexOf(x) === -1) rel.push(x);
    });
  }
  rel = rel.slice(0, 3);
  var vImgs = [document.getElementById('v1'), document.getElementById('v2'), document.getElementById('v3')];
  rel.forEach(function (x, k) { if (vImgs[k]) vImgs[k].style.backgroundImage = "url('assets/img/" + x.img + "')"; });

  document.getElementById('relList').innerHTML = rel.map(function (x) {
    return '<a class="case-card" href="case-detail.html?c=' + encodeURIComponent(x.id) + '">' +
      '<div class="case-cover"><div class="img-fit r-4-3" style="background-image:url(\'assets/img/' + x.img + '\')"></div>' +
        '<div class="case-hover"><span class="view">查看案例</span></div></div>' +
      '<div class="case-meta"><div class="case-client">' + x.c + '</div>' +
        '<div class="case-name">' + x.n + '</div></div></a>';
  }).join('');
};
</script>
</body>
</html>

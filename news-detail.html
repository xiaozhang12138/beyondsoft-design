<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新闻详情 · 博彦设计</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="about">

<div class="crumb">
  <div class="wrap">
    <a href="index.html">首页</a><span>&rsaquo;</span>
    <a href="about.html">关于我们</a><span>&rsaquo;</span>
    <a href="news.html">新闻动态</a><span>&rsaquo;</span><span id="crumbCat">新闻详情</span>
  </div>
</div>

<div class="detail-head">
  <div class="wrap">
    <h1 id="nTitle">新闻标题</h1>
    <div class="detail-info">
      <span id="nDate">发布时间：—</span>
      <span id="nCat">分类：—</span>
      <span>来源：博彦设计</span>
      <span>阅读：2.4k</span>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="detail-body">

    <div class="demo-note">正文由后台富文本编辑器维护，支持图文混排、视频嵌入与外链；从 Word 粘贴时自动清理格式。以下为示例正文。</div>

    <div id="nLead"></div>
    <div id="nBody"></div>

    <div style="display:flex;gap:12px;flex-wrap:wrap;margin:30px 0">
      <button class="btn btn-line btn-sm" onclick="alert('链接已复制到剪贴板，可分享给同事')">复制链接</button>
      <button class="btn btn-line btn-sm" onclick="alert('请使用微信扫一扫，分享给好友或朋友圈')">微信分享</button>
    </div>

    <div class="detail-nav">
      <a href="javascript:history.back()">&lsaquo; 返回列表</a>
      <a href="news.html">更多资讯</a>
    </div>
  </div>
</div>

<section class="sec soft" style="padding:60px 0">
  <div class="wrap">
    <div class="sec-head"><h2 class="sec-title" style="font-size:24px">相关阅读</h2></div>
    <div class="news-grid" id="nRelated"></div>
  </div>
</section>

<script src="assets/js/main.js"></script>
<script>
function buildBlocks(body) {
  return body.map(function (b) {
    if (b.h) return '<h2>' + b.h + '</h2>';
    if (b.img) return '<div class="r-16-9 img-fit" style="background-image:url(\'assets/img/' + b.img + '\')"></div>' +
      '<p style="text-align:center;font-size:13px;color:var(--c-muted);margin-top:-6px;margin-bottom:18px">' + (b.cap || '') + '</p>';
    return '<p>' + b.p + '</p>';
  }).join('');
}

window.pageInit = function () {
  var id = param('n');
  var news = (typeof getNews === 'function') ? getNews(id) : null;

  if (!news) {
    document.getElementById('nTitle').textContent = '未找到该资讯';
    document.getElementById('nBody').innerHTML = '<p>该资讯不存在或已下线。请返回<a href="news.html">新闻列表</a>查看其他内容。</p>';
    document.getElementById('nRelated').innerHTML = '';
    return;
  }

  document.title = news.t + ' · 博彦设计';
  document.getElementById('nTitle').textContent = news.t;
  document.getElementById('nDate').textContent = '发布时间：' + news.d;
  document.getElementById('nCat').textContent = '分类：' + news.c;
  document.getElementById('crumbCat').textContent = news.t;

  var lead = document.getElementById('nLead');
  lead.className = 'news-lead';
  lead.textContent = news.lead;

  document.getElementById('nBody').innerHTML = buildBlocks(news.body);

  // 相关阅读：取除本条外的其余 4 条
  var others = SITE_NEWS.filter(function (x) { return x.id !== news.id; }).slice(0, 4);
  document.getElementById('nRelated').innerHTML = others.map(function (x) {
    return '<a class="news-card" href="news-detail.html?n=' + x.id + '">' +
      '<div class="r-16-9 img-fit" style="background-image:url(\'assets/img/' + x.img + '\')"></div>' +
      '<div class="news-body"><div class="news-date">' + x.d + '</div>' +
        '<div class="news-title">' + x.t + '</div></div></a>';
  }).join('');
};
</script>
</body>
</html>

</head>
<body data-page="about" data-nav="dark">

<section class="page-hero">
  <div class="hero-bg" style="background-image:url('assets/img/about-position.jpg')"></div>
  <div class="page-hero-mask"></div>
  <div class="wrap page-hero-body">
    <h1>荣誉奖项</h1>

</section>

<div class="sub-nav">

<!-- ============ 公司资质 ============ -->
<section class="sec">
  <div class="wrap">
    <div class="sec-head rv">
      <div class="sec-kicker">Certifications</div>
      <h2 class="sec-title">公司资质</h2>
      <p class="sec-sub">权威资质认证，合作更安心</p>
    </div>
    <div class="cert-grid rv">
      <div class="cert-item"><div class="img-fit r-3-4" style="background:#1a4fd6;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px">ISO 9001<br>质量体系</div><p>质量管理体系认证</p></div>
      <div class="cert-item"><div class="img-fit r-3-4" style="background:#1a4fd6;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px">ISO 27001<br>信息安全</div><p>信息安全管理体系认证</p></div>
      <div class="cert-item"><div class="img-fit r-3-4" style="background:#16181d;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px">高新技术企业</div><p>国家高新技术企业</p></div>
      <div class="cert-item"><div class="img-fit r-3-4" style="background:#16181d;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px">软件著作权</div><p>多项软件著作权登记</p></div>
    </div>
  </div>
</section>

<!-- ============ 公司荣誉 ============ -->
<section class="sec soft">
  <div class="wrap">
    <div class="sec-head rv">
      <div class="sec-kicker">Awards</div>
      <h2 class="sec-title">客户认可与荣誉</h2>
      <p class="sec-sub">长期被头部客户评为年度优秀供应商</p>
    </div>

    <div class="tabs rv" style="justify-content:flex-start" id="yearTabs">
      <button class="tab active" data-y="全部">全部</button>
      <button class="tab" data-y="2026">2026</button>
      <button class="tab" data-y="2025">2025</button>
      <button class="tab" data-y="2024">2024</button>
    </div>

    <div class="honor-grid rv" id="honorGrid"></div>
  </div>
</section>

<script src="assets/js/main.js"></script>
<script>
var HONORS = [
  { y:'2026', n:'阿里云年度优秀设计供应商', o:'阿里云' },
  { y:'2026', n:'美团 TOP 设计合作伙伴', o:'美团' },
  { y:'2025', n:'京东年度卓越供应商', o:'京东' },
  { y:'2025', n:'百度大型活动视觉服务奖', o:'百度' },
  { y:'2025', n:'中国国际广告节长城奖入围', o:'行业评选' },
  { y:'2024', n:'快手年度框架优秀合作方', o:'快手' },
  { y:'2024', n:'用户体验设计标杆案例', o:'行业评选' },
  { y:'2024', n:'数字创意机构推荐品牌', o:'行业媒体' },
  { y:'2023', n:'蚂蚁集团长期合作贡献奖', o:'蚂蚁集团' }
];

function renderHonor(y) {
  var list = y === '全部' ? HONORS : HONORS.filter(function (x) { return x.y === y; });
  document.getElementById('honorGrid').innerHTML = list.map(function (x) {
    return '<div class="honor-item">' +
      '<div class="img-fit r-4-3" style="background:#1a4fd6;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">' + x.y + '<br>荣誉</div>' +
      '<h5>' + x.n + '</h5>' +
      '<span>' + x.o + ' · ' + x.y + '</span></div>';
  }).join('');
}

window.pageInit = function () {
  renderHonor('全部');
  document.querySelectorAll('#yearTabs .tab').forEach(function (t) {
    t.onclick = function () {
      document.querySelectorAll('#yearTabs .tab').forEach(function (x) { x.classList.remove('active'); });
      t.classList.add('active');
      renderHonor(t.getAttribute('data-y'));
    };
  });
};
</script>
</body>
</html>

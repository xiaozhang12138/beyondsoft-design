      <div class="svc-card" style="padding:40px 36px;display:block">
        <div class="svc-block-en" style="font-size:14px">计件模式</div>
        <h3 style="font-size:26px;color:var(--c-ink);font-weight:600;margin:8px 0 6px">灵活下单</h3>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div style="background:var(--c-bg-soft);border-radius:10px;padding:20px">

            <div style="font-size:13px;color:var(--c-primary);font-weight:600;margin-bottom:8px">按项目结算</div>
